<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>בחינה עצמית: Calculations ב־Power BI</title>
  <style>
    :root{--blue:#08a7df;--navy:#12344d;--ink:#17232d;--muted:#62717d;--bg:#f4f8fb;--card:#fff;--line:#dce8ef;--good:#087a4b;--goodbg:#eaf8f1;--bad:#b42318;--badbg:#fff0ee}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;line-height:1.55}
    header{background:linear-gradient(135deg,var(--navy),#075c84);color:#fff;padding:48px 20px 38px;border-bottom:7px solid var(--blue)}
    header>div,main{max-width:900px;margin:auto} h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)} header p{margin:0;color:#d9f3fc;font-size:18px}
    .progress-wrap{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;box-shadow:0 2px 8px #12344d14}
    .progress-row{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px}.track{height:10px;background:#e7eff4;border-radius:20px;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--blue);transition:.25s}.count{white-space:nowrap;color:var(--muted);font-weight:700}
    main{padding:30px 20px 60px}.question{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin:0 0 18px;box-shadow:0 6px 18px #12344d0b}.qnum{color:#087cab;font-weight:700;font-size:14px}.question h2{font-size:20px;margin:5px 0 16px}
    label{display:block;border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:9px 0;cursor:pointer;background:#fff}label:hover{border-color:#86cfe9;background:#f7fcfe}input{margin-left:9px;accent-color:var(--blue)}
    button{border:0;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer}.check{background:var(--navy);color:#fff;margin-top:9px}.check:hover{background:#075c84}.check:disabled{opacity:.5;cursor:default}
    .feedback{display:none;margin-top:13px;padding:11px 13px;border-radius:10px}.feedback.good{display:block;background:var(--goodbg);color:var(--good)}.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}
    .result{display:none;background:#fff;border:2px solid var(--blue);border-radius:18px;padding:28px;text-align:center;margin-top:28px}.result.show{display:block}.score{font-size:36px;font-weight:800;color:var(--navy)}.reset{background:var(--blue);color:#fff;margin-top:12px}
    .note{color:var(--muted);font-size:14px;margin-top:9px}@media(max-width:600px){header{padding-top:34px}.question{padding:19px}.progress-row{display:block}.count{margin-bottom:7px}}
  </style>
</head>
<body>
<header><div><h1>בחינה עצמית: Calculations</h1><p>8 שאלות להבנת עמודות מחושבות, Measures ופונקציות DAX בסיסיות. ללא עבודה עם נתונים.</p></div></header>
<div class="progress-wrap"><div class="progress-row"><div class="count" id="count">0 מתוך 8 נבדקו</div><div class="track"><div class="bar" id="bar"></div></div></div></div>
<main>
  <div id="quiz"></div>
  <section class="result" id="result"><div class="score" id="score"></div><p id="summary"></p><button class="reset" onclick="location.reload()">להתחיל מחדש</button></section>
</main>
<script>
const questions=[
 {q:'בטבלת מכירות קיימות העמודות כמות ומחיר ליחידה. רוצים לחשב את סכום המכירה בכל שורה. מה מתאים ליצור?',a:0,o:['עמודה מחושבת','Measure','Slicer','Relationship'],f:'עמודה מחושבת יוצרת ערך נפרד לכל שורת מכירה.'},
 {q:'רוצים להציג את סך המכירות כך שישתנה כאשר בוחרים שנה, סניף או מוצר. מה מתאים ליצור?',a:1,o:['עמודה מחושבת','Measure','עמודה ב־Power Query','טבלה חדשה'],f:'Measure מחושב בהתאם להקשר הסינון ולכן מתעדכן בעקבות הבחירות בדוח.'},
 {q:'Measure בשם "סך מכירות" מציג בכרטיס 2 מיליון ש״ח, ובגרף לפי סניפים הוא מציג סכום אחר לכל סניף. מה ההסבר?',a:1,o:['Power BI שינה את הנוסחה','כל סניף יוצר הקשר סינון שונה','נוצר Measure חדש לכל סניף','יש שגיאה בחישוב'],f:'הנוסחה נשארת זהה, אך כל סניף יוצר הקשר סינון אחר.'},
 {q:'תלמידה יצרה עמודה מחושבת של סכום המכירה ומצפה שהערכים בעמודה ישתנו כאשר היא בוחרת שנה ב־Slicer. האם זה יקרה?',a:1,o:['כן, כל עמודה משתנה בעקבות סינון','לא, הערכים בעמודה המחושבת נשמרים לכל שורה','כן, אבל רק אם משתמשים ב־SUM','לא, משום שאי אפשר לסנן עמודות'],f:'ה־Slicer משפיע על הנתונים המוצגים, אך אינו מחשב מחדש את ערכי העמודה המחושבת.'},
 {q:'רוצים להציג את אחוז התלמידים שעברו את המבחן מתוך כלל הנבחנים, כך שהתוצאה תשתנה כאשר מסננים לפי כיתה. איזו דרך מתאימה?',a:0,o:['יצירת Measure שמחלק את מספר התלמידים שעברו במספר הנבחנים','יצירת עמודה שבה מופיע אותו אחוז בכל שורה','שימוש ב־DISTINCTCOUNT בלבד','יצירת Relationship חדש'],f:'חלוקה בין Measures מאפשרת לאחוז להתעדכן בהתאם לכיתה ולמסננים נוספים.'},
 {q:'רוצים לחשב את סך המכירות של מוצרים מקטגוריית "צעצועים" בלבד. מה תפקידה של CALCULATE בחישוב?',a:1,o:['ליצור עמודה חדשה','לחשב את התוצאה תחת תנאי סינון','ליצור קשר בין הטבלאות','לחבר שתי טבלאות'],f:'CALCULATE מחשבת ביטוי תחת תנאי סינון שנקבע בנוסחה.'},
 {q:'איזה מהשדות הבאים מתאים לשימוש ב־Slicer?',a:2,o:['Measure של סך המכירות','Measure של ממוצע ציונים','עמודת קטגוריית מוצר','Measure של מספר לקוחות'],f:'Slicer זקוק לשדה המכיל ערכים שאפשר לבחור, כמו עמודת קטגוריית מוצר.'},
 {q:'רוצים להציג את אותו חישוב פעם אחת לפי שנה ופעם אחרת לפי מחלקה. האם צריך ליצור שני Measures?',a:2,o:['כן, Measure יכול להופיע רק בוויזואל אחד','כן, כל פילוח מחייב נוסחה אחרת','לא, אותו Measure מתאים את עצמו להקשר','לא, משום ש־Measure אינו מושפע מפילוחים'],f:'אותו Measure מחושב מחדש בהתאם להקשר שיוצרים השנה או המחלקה.'}
];
let checked=0,correct=0; const quiz=document.getElementById('quiz');
questions.forEach((x,i)=>{const s=document.createElement('section');s.className='question';s.innerHTML=`<div class="qnum">שאלה ${i+1}</div><h2>${x.q}</h2>${x.o.map((v,j)=>`<label><input type="radio" name="q${i}" value="${j}">${v}</label>`).join('')}<button class="check" data-i="${i}">בדיקה</button><div class="feedback" id="f${i}"></div>`;quiz.appendChild(s)});
document.querySelectorAll('.check').forEach(btn=>btn.addEventListener('click',()=>{const i=+btn.dataset.i,x=questions[i],pick=document.querySelector(`input[name=q${i}]:checked`),box=document.getElementById(`f${i}`);if(!pick){box.className='feedback bad';box.textContent='יש לבחור תשובה לפני הבדיקה.';return}const ok=+pick.value===x.a;box.className='feedback '+(ok?'good':'bad');box.textContent=(ok?'נכון. ':'לא נכון. ')+x.f;btn.disabled=true;document.querySelectorAll(`input[name=q${i}]`).forEach(el=>el.disabled=true);checked++;if(ok)correct++;document.getElementById('count').textContent=`${checked} מתוך ${questions.length} נבדקו`;document.getElementById('bar').style.width=`${checked/questions.length*100}%`;if(checked===questions.length)showResult()}));
function showResult(){const r=document.getElementById('result');document.getElementById('score').textContent=`${correct} מתוך ${questions.length}`;let t=correct>=7?'אפשר להתקדם ליחידה הבאה.':correct>=5?'כדאי לחזור על ההבדל בין עמודה מחושבת ל־Measure ועל השפעת הסינון.':'מומלץ לעבור שוב על המצגת ולנסות מחדש.';document.getElementById('summary').textContent=t;r.classList.add('show');r.scrollIntoView({behavior:'smooth'})}
</script>
</body>
</html>
